<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata>
    <slidra:effects xmlns:slidra="https://slidra.app/ns/2026">
      <slidra:effect target="el-p5-b" family="enter" effect="fade" start="on-click" duration="0.6" delay="0"/>
      <slidra:effect target="el-p5-a" family="enter" effect="fade" start="after-previous" duration="0.6" delay="0"/>
    </slidra:effects>
  </metadata>
  <g id="el-p5-title" data-slidra-name="Title">
    <text x="80" y="110" font-family="Noto Sans TC" font-size="40" fill="#333333">Closing</text>
  </g>
  <g id="el-p5-a" data-slidra-name="Item One" transform="translate(80 200)">
    <text font-family="Noto Sans TC" font-size="24" fill="#333333">Item One: appears at the top of the slide</text>
  </g>
  <g id="el-p5-b" data-slidra-name="Item Two" transform="translate(80 400)">
    <text font-family="Noto Sans TC" font-size="24" fill="#333333">Item Two: at the bottom, but its animation plays first</text>
  </g>
</svg>
