<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="el-a" data-slidra-name="方塊 A" transform="translate(80 80)">
    <rect x="0" y="0" width="140" height="90" fill="#c43e1c"/>
  </g>
  <g id="el-b" data-slidra-name="方塊 B" transform="translate(80 250)">
    <rect x="0" y="0" width="140" height="90" fill="#c43e1c"/>
  </g>
  <g id="el-c" data-slidra-name="方塊 C" transform="translate(80 420)">
    <rect x="0" y="0" width="140" height="90" fill="#2a6f3d"/>
  </g>
  <g id="el-text" data-slidra-name="文字框" data-slidra-text-width="300" transform="translate(500 80)">
    <text font-size="24" text-anchor="start" xml:space="preserve"><tspan x="0" y="24">樣式面板測試文字框</tspan></text>
  </g>
  <g id="el-group" data-slidra-name="群組" transform="translate(500 300)">
