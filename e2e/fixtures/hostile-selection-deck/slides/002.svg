<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!--
    #56 gate review round 1: a view-mode slide has `allow-scripts` too
    (ADR-0011), so it can forge a `slidra-player` message by hand — sender
    identity only proves which iframe sent it, never which script inside
    that iframe did. This slide carries none of slide 1's hostile CSS
    (that fixture tests a different attack, the Shadow DOM covering one);
    its only job is posting the forged message a few hundred ms after
    load, well after the app has settled on this page, and proving
    canvas.ts's mode gate rejects it.
  -->
  <text id="el-slide-two" x="640" y="360" text-anchor="middle" font-size="56">第二頁：偽造訊息</text>
  <script><![CDATA[
    setTimeout(function () {
      parent.postMessage({ source: "slidra-player", event: "advance-past-end" }, "*");
    }, 300);
  ]]></script>
</svg>
