<svg style="background-color:#101418" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata>
    <slidra:effects xmlns:slidra="https://slidra.app/ns/2026">
      <!-- Breakage: family/effect are both valid, but start="on-hover" is
           not in SUPPORTED_STARTS (all three of on-click/with-previous/
           after-previous are now implemented, D3). [E2.T7] turned
           with-previous into a really implemented start value, so it can no
           longer serve as the "unimplemented" counterexample; "on-hover" is
           this round's new guard value ([E2.T7] test inventory). -->
      <slidra:effect target="el-with-previous-target" family="enter" effect="fade" start="on-hover"/>
    </slidra:effects>
  </metadata>
  <text id="el-broken-title-5" x="640" y="120" text-anchor="middle" font-size="48" fill="#f4f6f8">Slide 5: unimplemented start</text>
  <text id="el-with-previous-target" x="640" y="400" text-anchor="middle" font-size="32" fill="#9aa7b4">This element really exists</text>
</svg>
