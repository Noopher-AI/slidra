<svg style="background-color:#101418" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata>
    <slidra:effects xmlns:slidra="https://slidra.app/ns/2026">
      <!-- Breakage: family="enter" is valid, but effect="wipe" is not in
           enter's SUPPORTED_EFFECTS list (only fade and appear). This is
           the mistake an author is most likely to make assuming a
           PowerPoint-style "wipe" can be used directly. -->
      <slidra:effect target="el-wipe-target" family="enter" effect="wipe" start="on-click"/>
    </slidra:effects>
  </metadata>
  <text id="el-broken-title-4" x="640" y="120" text-anchor="middle" font-size="48" fill="#f4f6f8">Slide 4: unimplemented effect</text>
  <text id="el-wipe-target" x="640" y="400" text-anchor="middle" font-size="32" fill="#9aa7b4">This element really exists</text>
</svg>
