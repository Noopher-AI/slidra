<svg style="background-color:#101418" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata>
    <slidra:effects xmlns:slidra="https://slidra.app/ns/2026">
      <!-- Breakage: target points at an element id that doesn't exist on
           this slide. Another realistic author typo — copying an effect
           entry and forgetting to update its target, or renaming an
           element without updating the effect list. -->
      <slidra:effect target="el-does-not-exist" family="enter" effect="fade" start="on-click"/>
    </slidra:effects>
  </metadata>
  <text id="el-broken-title-2" x="640" y="120" text-anchor="middle" font-size="48" fill="#f4f6f8">Slide 2: target points to a nonexistent element</text>
  <text id="el-real" x="640" y="400" text-anchor="middle" font-size="32" fill="#9aa7b4">This element really exists</text>
</svg>
