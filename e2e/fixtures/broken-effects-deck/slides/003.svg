<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata>
    <comot:effects xmlns:comot="https://co-motion.dev/ns">
      <!-- 損壞之處：family="build" 不在 @co-motion/core/effects 的
           SUPPORTED_EFFECTS 裡（[E2.T7] 的固定值集是 enter/emphasis/exit/
           path/media，D4）。"build" 是這輪「一個永遠不會被實作的家族名稱」
           的守門測試值——emphasis 本輪已經是真正實作的家族，不能再拿來當
           反例（[E2.T7] 測試盤點）。 -->
      <comot:effect target="el-emphasis-target" family="build" effect="pulse" start="on-click"/>
    </comot:effects>
  </metadata>
  <rect x="0" y="0" width="1280" height="720" fill="#101418"/>
  <text id="el-broken-title-3" x="640" y="120" text-anchor="middle" font-size="48" fill="#f4f6f8">第 3 頁：未實作的 family</text>
  <text id="el-emphasis-target" x="640" y="400" text-anchor="middle" font-size="32" fill="#9aa7b4">這個元素是真的存在的</text>
</svg>
