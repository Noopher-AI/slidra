<svg style="background-color:#101418" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="el-box" data-comot-name="沒有 font-family 的文字框" data-comot-text-width="200" transform="translate(100 100)">
    <text font-size="24" fill="#f4f6f8" xml:space="preserve"><tspan x="0" y="24">起頭</tspan></text>
  </g>
  <g id="el-plain" data-comot-name="一般文字">
    <text x="640" y="500" text-anchor="middle" font-size="36" fill="#9aa7b4">一般文字</text>
  </g>
  <g id="el-broken" data-comot-name="已有硬換行的一般文字">
    <text x="640" y="620" text-anchor="middle" font-size="28" fill="#c9d3dc"><tspan x="640" y="620" data-comot-break="1">第一行</tspan><tspan x="640" y="648">第二行</tspan></text>
  </g>
</svg>
