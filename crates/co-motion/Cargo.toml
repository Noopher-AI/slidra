[package]
name = "co-motion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "co_motion"
path = "src/lib.rs"

[[bin]]
name = "co-motion"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
