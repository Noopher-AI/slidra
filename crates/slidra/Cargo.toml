[package]
name = "slidra"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "slidra"
path = "src/lib.rs"

[[bin]]
name = "slidra"
path = "src/main.rs"

[[bin]]
name = "slidra-sandbox-exec"
path = "src/bin/sandbox_exec.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"
# The deck server's own HTTP request-line/header parser ([S11.F2]): already
# in `Cargo.lock` at 1.10.1 via `ureq`, so pinning it as a direct dependency
# here adds zero new transitive dependencies to the build.
httparse = "1"
flate2 = "1.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

# NOOP-425 L2: slidra-sandbox-exec's Landlock ruleset (agent sandbox, Linux
# only — macOS uses @anthropic-ai/sandbox-runtime's Seatbelt path instead,
# Windows degrades). Gated to the Linux target so the dependency (and its
# Linux-only syscalls) never needs to build, or even resolve, on other
# platforms.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
