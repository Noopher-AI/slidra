[package]
name = "slidra"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "slidra"
path = "src/lib.rs"

[[bin]]
name = "slidra"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "3"
flate2 = "1.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
