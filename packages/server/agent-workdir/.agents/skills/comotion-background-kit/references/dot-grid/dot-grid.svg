<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<defs>
<pattern id="bg-dots" width="32" height="32" patternUnits="userSpaceOnUse">
<circle cx="16" cy="16" r="2" fill="var(--muted)" opacity="0.75"/>
</pattern>
<radialGradient id="bg-dots-mask" cx="0.3" cy="0.45" r="0.75">
<stop offset="0" stop-color="var(--background)" stop-opacity="1"/>
<stop offset="0.5" stop-color="var(--background)" stop-opacity="0.7"/>
<stop offset="1" stop-color="var(--background)" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bg-dots-edge" x1="0" y1="1" x2="1" y2="0">
<stop offset="0.6" stop-color="var(--secondary_bg)" stop-opacity="0"/>
<stop offset="1" stop-color="var(--primary)" stop-opacity="0.32"/>
</linearGradient>
</defs>
<rect width="1280" height="720" fill="var(--background)"/>
<rect width="1280" height="720" fill="url(#bg-dots-edge)"/>
<rect width="1280" height="720" fill="url(#bg-dots)"/>
<rect width="1280" height="720" fill="url(#bg-dots-mask)"/>
<line x1="1040" y1="0" x2="1040" y2="720" stroke="var(--accent)" stroke-width="1" opacity="0.35"/>
  <ellipse cx="1180" cy="60" rx="420" ry="420" fill="var(--primary)" opacity="0.12"/>
</svg>
