name: Notify Multica on PR merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Collect changed files and notify
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.MULTICA_AUTOPILOT_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Read PR fields from the event payload, never interpolated into shell
          title=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
          base_ref=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          merge_sha=$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")
          html_url=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")

          files=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files -q '[.files[].path]')

          payload=$(jq -n \
            --argjson number "$PR_NUMBER" \
            --arg title "$title" \
            --arg base_ref "$base_ref" \
            --arg merge_commit_sha "$merge_sha" \
            --arg repo "$REPO" \
            --arg url "$html_url" \
            --argjson changed_files "$files" \
            '{merged_pr: {number: $number, title: $title, base_ref: $base_ref, merge_commit_sha: $merge_commit_sha, repo: $repo, url: $url, changed_files: $changed_files}}')

          curl -sS -f -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: comotion-pr-${PR_NUMBER}-${merge_sha}" \
            -d "$payload"
