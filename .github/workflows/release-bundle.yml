# Builds the vendoring bundle (npm run bundle, tools/build-bundle.mjs) for a
# format tag and attaches it to that tag's GitHub release:
#   slidra-bundle-<tag>.tar.gz         dist/slidra-bundle/ as a deterministic tarball
#   slidra-bundle-<tag>.tar.gz.sha256  its checksum (sha256sum -c)
name: Release bundle

on:
  push:
    tags: ["format-v*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run bundle
      - name: Pack dist/slidra-bundle/ deterministically
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(jq -r .source.commit dist/slidra-bundle/MANIFEST.json)" = "$GITHUB_SHA"
          test "$(jq -r .source.dirty dist/slidra-bundle/MANIFEST.json)" = "false"
          name="slidra-bundle-$TAG.tar.gz"
          tar --sort=name --format=gnu --mtime='1970-01-01 00:00:00Z' \
            --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' \
            -C dist -cf - slidra-bundle | gzip -n -9 > "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "The .slidra format and player at $TAG, bundled for vendoring. Verify with: sha256sum -c slidra-bundle-$TAG.tar.gz.sha256"
          gh release upload "$TAG" "slidra-bundle-$TAG.tar.gz" "slidra-bundle-$TAG.tar.gz.sha256" --clobber
