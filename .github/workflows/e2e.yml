name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "在 ubuntu-latest 上重產截圖並以 artifact 上傳，僅供跨平台診斷用；不得取代本機 macOS 產生的基準"
        type: boolean
        default: false

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run e2e tests
        # Baselines are macOS-rendered; this runner is Ubuntu, where font
        # rasterization differs enough that a pixel-level compare against
        # those baselines fails deterministically (not flaky). Appearance
        # regression stays a local gate — see AGENTS.md's "視覺回歸的把關分工".
        run: npm run test:e2e
        env:
          UPDATE_APPEARANCE_BASELINES: ${{ inputs.update_baselines && '1' || '' }}
          SKIP_APPEARANCE_BASELINES: ${{ !inputs.update_baselines && '1' || '' }}

      # 基準截圖的權威平台是本機 macOS，不是這裡的 ubuntu-latest——見
      # AGENTS.md「視覺回歸的把關分工」。這個 artifact 只是 ubuntu 渲染出的
      # 截圖，用來診斷跨平台字型渲染差異，其內容不得 commit 進
      # e2e/__screenshots__ 取代 macOS 基準。正式更新基準請依 AGENTS.md
      # 在本機執行 UPDATE_APPEARANCE_BASELINES=1 後再提交。
      - name: Upload ubuntu-rendered screenshots (diagnostic only)
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rendered-screenshots-diagnostic
          path: e2e/__screenshots__
