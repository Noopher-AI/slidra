name: ci

on:
  # Gate: blocks a PR from merging (required status check on `Protect main`).
  # Only PRs into main. A ticket PR into an `epic/<slug>` branch does not run
  # this: an epic collects many such PRs and re-running the whole gate for each
  # one costs more than it catches, and the epic's own PR into main runs it
  # before anything reaches main.
  pull_request:
    branches: [main]
    # The default types (opened/synchronize/reopened) all fire on a draft PR,
    # and `on:` has no draft filter — the skip is the `if:` on each job below.
    # `ready_for_review` is what makes the gate run the moment a PR leaves
    # draft, instead of waiting for the next push to it.
    types: [opened, synchronize, reopened, ready_for_review]
  # Post-merge canary: a squash merge lands a commit no run has tested, so
  # re-run the same gates on the branch itself to catch flakes and toolchain
  # drift.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    # Draft PRs skip the gate. Keep the `github.event_name` half: on a `push`
    # event there is no `pull_request` object at all, and `null == false` is
    # false in GitHub expressions, so the shorter condition would silently
    # skip the post-merge canary on main — the one run that tests the commit
    # a squash merge actually produced.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Includes the production build plus fast behavioral, API, and design-contract tests.
      - name: Run unit test suite
        run: npm test

      # This browser gate covers only cross-layer paths unit tests cannot:
      # browser/agent edits, playback, undo/redo, save/open persistence, and
      # Deck Space's own startup/create/open/rename/delete flow
      # (e2e/deck-space.test.ts, added [E6.T14r2] — this is what would have
      # caught the identity/owner-filtering regression at merge time instead
      # of a later integration pass). The full suite remains available
      # through npm run test:e2e.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core browser E2E suite
        run: npm run test:e2e:core

  # NOOP-472 AC1/AC2: the macOS half of the CLI/server/sandbox suite, kept
  # separate from `required` rather than a matrix so this context has its
  # own name (`required-macos`) — a shared `required` context across both
  # platforms would report only once and hide a macOS-only failure. This
  # job intentionally does not install Playwright or run test:e2e:core:
  # #349's scope is the CLI/server/sandbox suite (`npm test`), not the
  # browser gate, and macOS runners bill at 10x the Linux rate.
  #
  # Making this a required status check (AC1) happens in the repo's
  # ruleset settings, not in this file — the agent token this job runs
  # under cannot write branch protection/ruleset config (verified: GET
  # /repos/.../branches/main/protection returns 403). See the PR's Manual
  # verification checklist for the human step.
  required-macos:
    # Same condition as `required` above, and for the same reason.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Includes the production build (which builds slidra-sandbox-exec via
      # cargo) plus the CLI/server/sandbox unit suite — the darwin-only
      # Seatbelt tests in os-enforcement.test.ts run for the first time here.
      - name: Run unit test suite
        run: npm test
