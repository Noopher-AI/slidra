name: ci

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Includes the production build plus fast behavioral, API, and design-contract tests.
      - name: Run unit test suite
        run: npm test

      # This browser gate covers only cross-layer paths unit tests cannot:
      # browser/agent edits, playback, undo/redo, and save/open persistence.
      # The full suite remains available through npm run test:e2e.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core browser E2E suite
        run: npm run test:e2e:core
