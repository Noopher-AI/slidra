name: e2e

on:
  push:
  pull_request:

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Run e2e tests
        # Baselines are macOS-rendered; this runner is Ubuntu, where font
        # rasterization differs enough that a pixel-level compare against
        # those baselines fails deterministically (not flaky). Appearance
        # regression stays a local gate — see AGENTS.md's "視覺回歸的把關分工".
        run: npm run test:e2e
        env:
          SKIP_APPEARANCE_BASELINES: "1"
