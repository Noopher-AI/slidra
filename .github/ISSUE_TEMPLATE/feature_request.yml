name: Feature request
description: Suggest an improvement or a new capability for Slidra
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed CLI or format change
      description: What would the CLI, format, or behavior change look like?
    validations:
      required: true
  - type: dropdown
    id: needs-rfc
    attributes:
      label: Does this need a spec RFC?
      description: Any change to the `.slidra` file format requires an RFC under `spec/rfcs/`.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
