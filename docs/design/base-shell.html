<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>CoMotion 基座樣板</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   CoMotion 基座樣板 — Office 深色主題
   這一段就是「基座」。整個 app 只能用這裡的值。
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* 表面：由外而內、由淺至深。深度靠明度差，不靠邊框。 */
  --s-titlebar:  #201f1e;
  --s-ribbon:    #292827;
  --s-panel:     #201f1e;   /* 縮圖軌、對話、備忘稿 */
  --s-well:      #100f0f;   /* 舞台底 — 全 app 最深，投影片才浮得起來 */
  --s-raised:    #323130;   /* hover／輸入框 */
  --s-sunken:    #1b1a19;

  /* 線：只有一種粗細，只有兩種強度。 */
  --line:        #3b3a39;
  --line-soft:   #2b2a29;

  /* 字：三階，不多不少。 */
  --ink:         #f3f2f1;
  --ink-dim:     #a19f9d;
  --ink-faint:   #6b6968;   /* disabled 專用 */

  /* 重點色：PowerPoint 磚紅。只用在「現在在哪」與「選到什麼」。 */
  --accent:      #c41e3a;
  --accent-hi:   #e03a56;
  --accent-wash: rgba(196, 30, 58, .16);

  /* 節奏：4px 基準。 */
  --u: 4px;
  --r: 3px;                  /* 圓角只有一個值，Office 是方的 */

  /* 尺寸 */
  --h-titlebar:  36px;
  --h-tabs:      30px;
  --h-ribbon:    84px;
  --h-status:    26px;
  --w-rail:      196px;
  --w-chat:      316px;
  --h-notes:     104px;

  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --fs-ui:    12.5px;
  --fs-small: 11.5px;
  --fs-lead:  14px;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-ui);
  color: var(--ink);
  background: var(--s-well);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ── 固定比例的視窗 ──────────────────────────────────────────
   樣板永遠以 1440×900 的視窗呈現，再整體等比縮放置中。
   預覽面板寬窄不同時，外殼的比例才不會被壓變形。 */
.viewport {
  position: fixed; inset: 0;
  background: #0a0a0a; overflow: hidden;
}
.frame {
  width: 1440px; height: 900px;
  position: absolute; left: 50%; top: 50%;
  transform-origin: center center;
  border: 1px solid var(--line-soft);
  box-shadow: 0 24px 80px -20px rgba(0,0,0,.9);
  overflow: hidden;
}

/* ── 版面骨架 ────────────────────────────────────────────────── */
.app {
  height: 100%;
  display: grid;
  grid-template-rows: var(--h-titlebar) auto 1fr var(--h-status);
}

/* ── 標題列 ──────────────────────────────────────────────────── */
.titlebar {
  background: var(--s-titlebar);
  border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center;
  padding: 0 calc(var(--u) * 3);
  gap: calc(var(--u) * 3);
}
.mark {
  font-size: var(--fs-small); font-weight: 700; letter-spacing: .14em;
  color: var(--accent-hi);
}
.deck-name { color: var(--ink); font-size: var(--fs-ui); }
.deck-meta { color: var(--ink-faint); font-size: var(--fs-small); }
.titlebar .spacer { flex: 1; }
.agent-dot {
  display: flex; align-items: center; gap: calc(var(--u) * 1.5);
  color: var(--ink-dim); font-size: var(--fs-small);
}
.agent-dot i {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4a8f45; box-shadow: 0 0 0 2px rgba(74,143,69,.18);
}

/* ── ribbon ─────────────────────────────────────────────────── */
.ribbon { background: var(--s-ribbon); border-bottom: 1px solid var(--line); }
.tabs {
  height: var(--h-tabs);
  display: flex; align-items: stretch;
  padding: 0 calc(var(--u) * 2);
  border-bottom: 1px solid var(--line-soft);
}
.tab {
  padding: 0 calc(var(--u) * 3);
  color: var(--ink-dim);
  border-bottom: 2px solid transparent;
  font-size: var(--fs-ui);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] {
  color: var(--ink); border-bottom-color: var(--accent);
}

.groups { height: var(--h-ribbon); display: flex; align-items: stretch; padding: 0 var(--u); }
.group {
  display: flex; align-items: center; gap: var(--u);
  padding: 0 calc(var(--u) * 2) calc(var(--u) * 4);
  position: relative;
}
.group + .group::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 22px;
  border-left: 1px solid var(--line-soft);
}
.group-label {
  position: absolute; bottom: 4px; left: 0; right: 0;
  text-align: center; font-size: 10.5px; color: var(--ink-faint);
}

.cmd {
  width: 72px; height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * 1.5);
  border-radius: var(--r);
  color: var(--ink);
  font-size: var(--fs-small);
  line-height: 1.15; text-align: center;
}
.cmd svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.cmd:not(:disabled):hover { background: var(--s-raised); }
.cmd:disabled { color: var(--ink-faint); cursor: default; }
.cmd:disabled svg { opacity: .55; }

/* ── 中段三欄 ────────────────────────────────────────────────── */
.body { display: grid; grid-template-columns: var(--w-rail) 1fr var(--w-chat); min-height: 0; }

/* 縮圖軌 */
.rail {
  background: var(--s-panel); border-right: 1px solid var(--line-soft);
  overflow-y: auto; padding: calc(var(--u) * 2) 0;
}
.thumb-row {
  display: grid; grid-template-columns: 20px 1fr;
  gap: calc(var(--u) * 2); align-items: start;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
}
.thumb-no {
  text-align: right; padding-top: calc(var(--u) * 1);
  color: var(--ink-faint); font-size: var(--fs-small);
  font-variant-numeric: tabular-nums;
}
.thumb {
  aspect-ratio: 1280 / 720; width: 100%;
  border: 1px solid var(--line); border-radius: 2px;
  overflow: hidden; background: #000; display: block; padding: 0;
  outline: 2px solid transparent; outline-offset: 1px;
}
.thumb svg { display: block; width: 100%; height: 100%; }
.thumb-row[aria-current="true"] .thumb { outline-color: var(--accent); border-color: var(--accent); }
.thumb-row[aria-current="true"] .thumb-no { color: var(--ink); }

/* 主區 */
.main { display: grid; grid-template-rows: 1fr var(--h-notes); min-width: 0; }

.well {
  background: var(--s-well);
  display: grid; place-items: center;
  padding: calc(var(--u) * 7);
  min-height: 0; min-width: 0; overflow: hidden;
  position: relative;
}
/* 舞台：比例來自 project.json 的 canvas，永遠 fit，永遠不出捲軸。
   邊界必須自己成立 — demo 的投影片是深色的，不能靠「投影片是白的」。 */
.stage {
  aspect-ratio: 1280 / 720;
  width: 100%; height: auto;
  max-width: 100%; max-height: 100%;
  position: relative;
  background: #fff;
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 18px 44px -12px rgba(0,0,0,.8);
}
.stage svg { display: block; width: 100%; height: 100%; }

/* 選取框 — 實作上畫在 iframe 內的 Shadow DOM 裡，這裡只示意長相 */
.sel { position: absolute; outline: 1px solid var(--accent-hi); pointer-events: none; }
.sel::before, .sel::after,
.sel i::before, .sel i::after,
.sel b::before, .sel b::after,
.sel u::before, .sel u::after {
  content: ""; position: absolute; width: 7px; height: 7px;
  background: var(--s-titlebar); border: 1px solid var(--accent-hi);
}
.sel::before      { left: -4px; top: -4px; }
.sel::after       { right: -4px; top: -4px; }
.sel i::before    { left: -4px; bottom: -4px; }
.sel i::after     { right: -4px; bottom: -4px; }
.sel b::before    { left: calc(50% - 4px); top: -4px; }
.sel b::after     { left: calc(50% - 4px); bottom: -4px; }
.sel u::before    { left: -4px; top: calc(50% - 4px); }
.sel u::after     { right: -4px; top: calc(50% - 4px); }

/* 備忘稿 */
.notes {
  background: var(--s-panel); border-top: 1px solid var(--line-soft);
  padding: calc(var(--u) * 2) calc(var(--u) * 5);
  display: flex; flex-direction: column; gap: var(--u);
}
.notes-label { color: var(--ink-faint); font-size: 10.5px; letter-spacing: .1em; }
.notes-empty { color: var(--ink-faint); font-size: var(--fs-ui); }

/* 對話 */
.chat {
  background: var(--s-panel); border-left: 1px solid var(--line-soft);
  display: grid; grid-template-rows: 34px 1fr auto; min-height: 0;
}
.chat-head {
  display: flex; align-items: center; padding: 0 calc(var(--u) * 3);
  border-bottom: 1px solid var(--line-soft);
  color: var(--ink-dim); font-size: 10.5px; letter-spacing: .1em;
}
.chat-log {
  overflow-y: auto; padding: calc(var(--u) * 3);
  display: flex; flex-direction: column; gap: calc(var(--u) * 2);
}
.msg { padding: calc(var(--u) * 2) calc(var(--u) * 2.5); border-radius: var(--r); line-height: 1.55; max-width: 88%; }
.msg-author { align-self: flex-end; background: var(--accent-wash); border: 1px solid rgba(196,30,58,.3); }
.msg-agent  { align-self: flex-start; background: var(--s-sunken); border: 1px solid var(--line-soft); }
.cmd-line {
  align-self: stretch; border-left: 2px solid #4a8f45;
  background: var(--s-sunken); padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font-size: var(--fs-small); display: flex; gap: calc(var(--u) * 2); align-items: baseline;
}
.cmd-line span { color: var(--ink-faint); white-space: nowrap; }
.cmd-line code { color: var(--ink-dim); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
.chat-input { display: flex; gap: var(--u); padding: calc(var(--u) * 3); border-top: 1px solid var(--line-soft); }
.chat-input input {
  flex: 1; background: var(--s-sunken); border: 1px solid var(--line);
  border-radius: var(--r); color: var(--ink); padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
  font: inherit;
}
.chat-input input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
.chat-input button {
  padding: 0 calc(var(--u) * 3); border-radius: var(--r);
  background: var(--accent); color: #fff;
}

/* ── 狀態列 ──────────────────────────────────────────────────── */
.status {
  background: var(--s-titlebar); border-top: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: calc(var(--u) * 4);
  padding: 0 calc(var(--u) * 3);
  color: var(--ink-dim); font-size: var(--fs-small);
}
.status .spacer { flex: 1; }
.status .sel-name { color: var(--ink); }
.status .sel-name b { color: var(--accent-hi); font-weight: 400; }
.views { display: flex; gap: 1px; }
.view-btn {
  width: 26px; height: 20px; display: grid; place-items: center;
  border-radius: 2px; color: var(--ink-dim);
}
.view-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.view-btn:hover { background: var(--s-raised); color: var(--ink); }
.view-btn[aria-pressed="true"] { background: var(--s-raised); color: var(--accent-hi); }

/* ── 總覽網格檢視 ────────────────────────────────────────────── */
.grid-view {
  background: var(--s-well); overflow-y: auto; padding: calc(var(--u) * 6);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: calc(var(--u) * 5); align-content: start;
}
.grid-cell { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.grid-cell .thumb { border-width: 1px; }
.grid-cell figcaption { color: var(--ink-faint); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
.grid-cell[aria-current="true"] figcaption { color: var(--ink); }
.grid-cell[aria-current="true"] .thumb { outline-color: var(--accent); border-color: var(--accent); }
/* 總覽網格是「瀏覽整份」的檢視，PPT 的投影片瀏覽也沒有備忘稿 */
.main.is-grid { grid-template-rows: 1fr; }
.main.is-grid .notes { display: none; }

/* ── 播放模式 ────────────────────────────────────────────────── */
.play {
  position: absolute; inset: 0; background: #000; z-index: 50;
  display: grid; place-items: center; cursor: none;
}
.play.awake { cursor: default; }
.play .stage { border: 0; box-shadow: none; background: #000; }
.play-bar {
  position: absolute; left: calc(var(--u) * 5); bottom: calc(var(--u) * 5);
  display: flex; align-items: center; gap: var(--u);
  padding: calc(var(--u) * 1.5);
  background: rgba(32,31,30,.82);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 5px;
  backdrop-filter: blur(12px);
  opacity: 0; transition: opacity .18s ease;
}
.play.awake .play-bar { opacity: 1; }
.play-bar button {
  width: 28px; height: 26px; display: grid; place-items: center;
  border-radius: 2px; color: var(--ink-dim);
}
.play-bar button:hover { background: rgba(255,255,255,.09); color: var(--ink); }
.play-bar svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.play-bar .pos {
  padding: 0 calc(var(--u) * 2); color: var(--ink-dim);
  font-size: var(--fs-small); font-variant-numeric: tabular-nums;
}
.play-bar .div { width: 1px; align-self: stretch; background: rgba(255,255,255,.12); margin: 0 var(--u); }
.play-bar .leave { width: auto; padding: 0 calc(var(--u) * 2.5); color: var(--ink-dim); font-size: var(--fs-small); }

[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="viewport">
<div class="frame" id="frame">

<div class="app">

  <!-- ───────── 標題列 ───────── -->
  <header class="titlebar">
    <span class="mark">COMOTION</span>
    <span class="deck-name">驗收用簡報</span>
    <span class="deck-meta">1280 × 720</span>
    <span class="spacer"></span>
    <span class="agent-dot"><i></i>Claude Code 已連線</span>
  </header>

  <!-- ───────── ribbon ───────── -->
  <div class="ribbon">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-tab="home">常用</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="insert">插入</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="trans">切換</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="show">投影片放映</button>
    </div>
    <div class="groups" id="ribbon-groups"></div>
  </div>

  <!-- ───────── 中段 ───────── -->
  <div class="body">
    <nav class="rail" id="rail"></nav>

    <div class="main">
      <div class="well" id="well">
        <div class="stage" id="stage"></div>
      </div>
      <div class="grid-view" id="grid" hidden></div>
      <section class="notes">
        <div class="notes-label">備忘稿</div>
        <div class="notes-empty">這一頁還沒有備忘稿。</div>
      </section>
    </div>

    <aside class="chat">
      <div class="chat-head">對話</div>
      <div class="chat-log">
        <div class="msg msg-author">把第 3 頁的三個步驟改成淡入，一步一個。</div>
        <div class="cmd-line"><span>已完成</span><code>co-motion effect add --slide 3</code></div>
        <div class="cmd-line"><span>已完成</span><code>co-motion effect add --slide 3</code></div>
        <div class="msg msg-agent">改好了。第 3 頁現在有三個步驟，每一步淡入一行。</div>
      </div>
      <form class="chat-input" onsubmit="return false">
        <input placeholder="輸入訊息給 agent…">
        <button type="submit">送出</button>
      </form>
    </aside>
  </div>

  <!-- ───────── 狀態列 ───────── -->
  <footer class="status">
    <span class="sel-name">已選取：<b>標題</b></span>
    <span class="spacer"></span>
    <span id="status-pos">第 1 頁，共 4 頁</span>
    <div class="views">
      <button class="view-btn" aria-pressed="true"  data-view="normal" title="標準">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="4" height="11"/><rect x="7.5" y="2.5" width="7" height="11"/></svg>
      </button>
      <button class="view-btn" aria-pressed="false" data-view="grid" title="總覽網格">
        <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="5.5" height="4.5"/><rect x="9" y="2.5" width="5.5" height="4.5"/><rect x="1.5" y="9" width="5.5" height="4.5"/><rect x="9" y="9" width="5.5" height="4.5"/></svg>
      </button>
      <button class="view-btn" aria-pressed="false" data-view="play" title="播放">
        <svg viewBox="0 0 16 16"><path d="M4 2.5 L13 8 L4 13.5 Z"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- ───────── 播放模式 ───────── -->
<div class="play" id="play" hidden>
  <div class="stage" id="play-stage"></div>
  <div class="play-bar">
    <button title="上一步"><svg viewBox="0 0 16 16"><path d="M10 3 L5 8 L10 13"/></svg></button>
    <button title="下一步"><svg viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13"/></svg></button>
    <span class="pos">1 / 4</span>
    <span class="div"></span>
    <button title="全螢幕"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
    <button class="leave" id="leave-play">離開播放</button>
  </div>
</div>

</div><!-- /.frame -->
</div><!-- /.viewport -->

<script>
/* ══ 固定比例：1440×900 的視窗，等比縮到裝得下為止 ══ */
function fitFrame() {
  const f = document.getElementById('frame');
  const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900, 1);
  f.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fitFrame);
fitFrame();
</script>

<script>
/* ══ 資料：真的 demo 簡報 ══ */
const SLIDES = [
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#101418"/>
  <text x="640" y="330" text-anchor="middle" font-size="86" fill="#f4f6f8">驗收用簡報</text>
  <text x="640" y="420" text-anchor="middle" font-size="36" fill="#9aa7b4">第 1 頁：換頁、即時預覽</text>
</svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#101418"/>
  <text x="640" y="150" text-anchor="middle" font-size="64" fill="#f4f6f8">第 2 頁：資產</text>
  <g transform="translate(490,220)"><rect width="300" height="300" rx="24" fill="#2d6cdf"/><circle cx="150" cy="120" r="56" fill="#ffd166"/><path d="M40 260 L120 150 L190 240 L230 195 L260 260 Z" fill="#0b3d91"/></g>
</svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#101418"/>
  <text x="640" y="140" text-anchor="middle" font-size="64" fill="#f4f6f8">第 3 頁：效果清單</text>
  <text x="640" y="300" text-anchor="middle" font-size="40" fill="#9aa7b4">步驟一</text>
  <text x="640" y="390" text-anchor="middle" font-size="40" fill="#9aa7b4">步驟二</text>
  <text x="640" y="480" text-anchor="middle" font-size="40" fill="#9aa7b4">步驟三</text>
</svg>`,
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#101418"/>
  <text x="640" y="90" text-anchor="middle" font-size="56" fill="#f4f6f8">第 4 頁：影音</text>
  <text x="640" y="150" text-anchor="middle" font-size="30" fill="#9aa7b4">重點說明</text>
  <rect x="240" y="220" width="400" height="300" fill="#3a4550"/>
  <circle cx="960" cy="370" r="70" fill="#c66"/>
  <path d="M935 340 L935 400 L955 400 L985 425 L985 315 L955 340 Z" fill="#101418"/>
  <text x="960" y="470" text-anchor="middle" font-size="26" fill="#9aa7b4">旁白</text>
</svg>`];

  paste:'<rect x="5" y="3" width="10" height="14"/><path d="M8 3V1.5h4V3"/>', cut:'<circle cx="5" cy="15" r="2"/><circle cx="15" cy="15" r="2"/><path d="M6 13.5L14 3M14 13.5L6 3"/>',
  copy:'<rect x="3" y="3" width="9" height="11"/><path d="M6 16h8V6"/>', textbox:'<rect x="2.5" y="5" width="15" height="10"/><path d="M7 8h6M10 8v4"/>',
  shape:'<circle cx="7" cy="7" r="4.5"/><rect x="8" y="9" width="8" height="8"/>', arrange:'<rect x="2.5" y="2.5" width="9" height="9"/><rect x="8" y="8" width="9" height="9"/>',
  image:'<rect x="2.5" y="3.5" width="15" height="13"/><circle cx="7" cy="8" r="1.5"/><path d="M3 15l5-5 4 4 2-2 3 3"/>',
  video:'<rect x="2.5" y="4.5" width="10" height="11"/><path d="M13 8l4.5-2.5v9L13 12z"/>', audio:'<path d="M4 8v4h3l4 3.5V4.5L7 8z"/><path d="M13.5 7.5a4 4 0 010 5"/>',
  table:'<rect x="2.5" y="3.5" width="15" height="13"/><path d="M2.5 8h15M2.5 12h15M7.5 3.5v13M12.5 3.5v13"/>',
  chart:'<path d="M3 17V3"/><path d="M3 17h14"/><rect x="6" y="10" width="3" height="7"/><rect x="11" y="6" width="3" height="11"/>',
  number:'<rect x="2.5" y="3.5" width="15" height="13"/><path d="M12 14h3"/>',
  none:'<circle cx="10" cy="10" r="7"/><path d="M5 15L15 5"/>', fade:'<circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 010 14z" fill="currentColor" stroke="none" opacity=".5"/>',
  push:'<rect x="2.5" y="4.5" width="15" height="11"/><path d="M7 10h6M11 7l3 3-3 3"/>', wipe:'<rect x="2.5" y="4.5" width="15" height="11"/><path d="M10 4.5v11"/>',
  split:'<rect x="2.5" y="4.5" width="6" height="11"/><rect x="11.5" y="4.5" width="6" height="11"/>',
  effopt:'<circle cx="10" cy="10" r="3"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3"/>', applyall:'<path d="M3 10l4 4 10-10"/>',
  fromstart:'<path d="M6 4l9 6-9 6z"/><path d="M3 4v12"/>', fromhere:'<path d="M5 4l9 6-9 6z"/>',
  fullscr:'<path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/>', timer:'<circle cx="10" cy="11" r="6"/><path d="M10 8v3l2 2M8 2h4"/>',
  record:'<circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="2.5" fill="currentColor" stroke="none"/>',
  hide:'<path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><path d="M3 3l14 14"/>',
  custom:'<rect x="2.5" y="3.5" width="15" height="13"/><path d="M6 7h8M6 10h8M6 13h5"/>',
  setup:'<circle cx="10" cy="10" r="2.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.5 4.5l1.5 1.5M14 14l1.5 1.5M15.5 4.5L14 6M6 14l-1.5 1.5"/>'
};
const RIBBON = {
  home:  [['投影片', [['新增投影片','plus'],['版面配置','layout']]],
          ['剪貼簿', [['貼上','paste'],['剪下','cut'],['複製','copy']]],
          ['繪圖',   [['文字方塊','textbox'],['圖案','shape'],['排列','arrange']]]],
  insert:[['媒體', [['圖片','image'],['影片','video'],['音訊','audio']]],
          ['內容', [['表格','table'],['圖表','chart'],['圖案','shape']]],
          ['文字', [['文字方塊','textbox'],['頁碼','number']]]],
  trans: [['切換效果', [['無','none'],['淡入淡出','fade'],['推移','push'],['擦去','wipe'],['分割','split']]],
          ['計時',     [['效果選項','effopt'],['全部套用','applyall']]]],
  show:  [['開始放映', [['從頭播放','fromstart',1],['從目前投影片','fromhere',1],['全螢幕','fullscr',1]]],
          ['設定',     [['排練計時','timer'],['錄製','record'],['隱藏投影片','hide']]],
          ['自訂',     [['自訂放映','custom'],['設定放映方式','setup']]]]
};

let current = 0;
const $ = s => document.querySelector(s);

function renderRibbon(tab) {
  $('#ribbon-groups').innerHTML = RIBBON[tab].map(([label, cmds]) => `
    <div class="group">
      ${cmds.map(([name, icon, on]) => `
        <button class="cmd" ${on ? '' : 'disabled title="尚未實作"'}>
          <svg viewBox="0 0 20 20">${I[icon]}</svg><span>${name}</span>
        </button>`).join('')}
      <span class="group-label">${label}</span>
    </div>`).join('');
}

function renderRail() {
  $('#rail').innerHTML = SLIDES.map((svg, i) => `
    <div class="thumb-row" aria-current="${i === current}">
      <div class="thumb-no">${i + 1}</div>
      <button class="thumb" data-i="${i}">${svg}</button>
    </div>`).join('');
  $('#grid').innerHTML = SLIDES.map((svg, i) => `
    <figure class="grid-cell" aria-current="${i === current}" style="margin:0">
      <button class="thumb" data-i="${i}">${svg}</button>
      <figcaption>第 ${i + 1} 頁</figcaption>
    </figure>`).join('');
}

function renderStage() {
  $('#stage').innerHTML = SLIDES[current] +
    (current === 0 ? '<div class="sel" style="left:22%;top:36%;width:56%;height:14%"><i></i><b></b><u></u></div>' : '');
  $('#play-stage').innerHTML = SLIDES[current];
  $('#status-pos').textContent = `第 ${current + 1} 頁，共 ${SLIDES.length} 頁`;
  $('.status .sel-name').style.visibility = current === 0 ? 'visible' : 'hidden';
}

function setView(v) {
  document.querySelectorAll('.view-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  $('#well').hidden = v !== 'normal';
  $('#grid').hidden = v !== 'grid';
  $('.main').classList.toggle('is-grid', v === 'grid');
  $('#play').hidden = v !== 'play';
  if (v === 'play') wake();
}

/* 播放模式：游標與控制列閒置 2.5 秒後一起消失 */
let sleepTimer;
function wake() {
  $('#play').classList.add('awake');
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(() => $('#play').classList.remove('awake'), 2500);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === tab));
    renderRibbon(tab.dataset.tab);
  }
  const thumb = e.target.closest('.thumb');
  if (thumb) { current = +thumb.dataset.i; renderRail(); renderStage(); }
  const view = e.target.closest('.view-btn');
  if (view) setView(view.dataset.view);
  if (e.target.closest('#leave-play')) setView('normal');
});
$('#play').addEventListener('mousemove', wake);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') setView('normal');
  if (e.key === 'ArrowRight' && current < SLIDES.length - 1) { current++; renderRail(); renderStage(); }
  if (e.key === 'ArrowLeft'  && current > 0)                 { current--; renderRail(); renderStage(); }
});

renderRibbon('home'); renderRail(); renderStage();
</script>
</body>
</html>
