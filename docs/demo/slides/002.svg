<svg style="background-color:#101418" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="el-asset-title" data-slidra-name="Title">
    <text x="640" y="150" text-anchor="middle" font-size="64" fill="#f4f6f8">Page 2: assets</text>
  </g>
  <!-- Relative path on purpose: the canvas injects a <base> so the browser
       resolves it to /api/raw/. If this picture is missing, that wiring broke. -->
